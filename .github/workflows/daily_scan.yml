name: Daily Stock Mention Scan

on:
  schedule:
    # 每天台灣時間 08:00（UTC 00:00）
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      use_whisper:
        description: '是否啟用 Whisper 轉錄 Podcast 音訊（YouTube 永遠不使用）'
        required: false
        default: 'true'
      max_items:
        description: '每個來源最多掃幾支（測試用可設 2）'
        required: false
        default: '5'
      days_back:
        description: '往回掃幾天'
        required: false
        default: '7'
      test_download_only:
        description: '只測試音訊下載，不跑 Whisper（快速驗證 cookies）'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scanner/requirements.txt

      - name: Install base dependencies
        run: pip install "yt-dlp>=2025.1.1" requests "youtube-transcript-api>=1.0.0" google-genai "pypinyin>=0.53,<1"

      - name: Cache Whisper model
        if: ${{ inputs.use_whisper != 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small-int8

      - name: Install Whisper (only when USE_WHISPER=true)
        if: ${{ inputs.use_whisper != 'false' }}
        run: pip install faster-whisper==1.1.1

      - name: Pre-load Whisper model (with timeout)
        if: ${{ inputs.use_whisper != 'false' }}
        timeout-minutes: 3
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys
          os.environ.setdefault("HF_TOKEN", os.environ.get("HF_TOKEN", ""))
          try:
              from faster_whisper import WhisperModel
              print("Downloading/loading small Whisper model...")
              m = WhisperModel("small", device="cpu", compute_type="int8")
              print("Model ready.")
          except Exception as e:
              print(f"Model pre-load failed: {e}", file=sys.stderr)
              sys.exit(0)  # non-fatal, scanner will fallback
          EOF

      - name: Write YouTube cookies
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > /tmp/yt_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Run scanner regression tests
        run: python -m unittest scanner/tests/test_validator_regressions.py -v

      - name: Run scanner
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          USE_WHISPER: ${{ inputs.use_whisper || vars.USE_WHISPER || 'true' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAYS_BACK: ${{ inputs.days_back || vars.DAYS_BACK || '7' }}
          MAX_ITEMS: ${{ inputs.max_items || vars.MAX_ITEMS || '5' }}
          TEST_DOWNLOAD_ONLY: ${{ inputs.test_download_only || 'false' }}
        run: python scanner/main.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== data/ contents ==="
          ls -la data/ 2>/dev/null || echo "(data/ not found)"
          git add -u data/ 2>/dev/null || true   # stage modifications + deletions
          git add data/latest.json
          git add data/stocks.json 2>/dev/null || true
          git add data/us_sp500_cache.json 2>/dev/null || true
          git add data/sectors_cache.json 2>/dev/null || true
          git add data/tw_industry_cache.json 2>/dev/null || true
          git add data/etf_names_cache.json 2>/dev/null || true
          git add data/gemini_usage.json 2>/dev/null || true
          git add data/learned_aliases.json 2>/dev/null || true
          git add data/alias_candidates.json 2>/dev/null || true
          git add data/rejected_aliases.json 2>/dev/null || true
          git add data/skip_log_*.json 2>/dev/null || true
          echo "=== staged diff stat ==="
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily scan $(date -u +%Y-%m-%d)"
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main
            git push
          fi
